name: Apply cfg bool compatibility fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-cfg-bool-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source patch
        run: python .github/cfg_bool_fix.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spectral_ui.cpp
          git diff --cached --check
          git commit -m "Fix persistent time marker toggle compatibility"
          git push origin HEAD:main
