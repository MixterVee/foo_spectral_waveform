name: Apply centered scrub overscroll

on:
  push:
    paths:
      - '.github/centered_scrub_overscroll_patch.py'
      - '.github/workflows/apply-centered-scrub-overscroll.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/centered_scrub_overscroll_patch.py
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spectral_ui.cpp
          git commit -m "Allow centered platter overscroll at track edges"
          git push
