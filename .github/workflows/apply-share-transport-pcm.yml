name: Apply Spectral transport PCM publishing

on:
  push:
    paths:
      - '.github/workflows/apply-share-transport-pcm.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source patch
        run: python .github/share_transport_pcm_patch.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stem_waveform_analysis.cpp
          git commit -m "Publish progressive stem PCM to transport cache"
          git push
