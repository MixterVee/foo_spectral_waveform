name: Promote Stem Blend Waveform Stable

on:
  push:
    branches: [ main ]
    paths:
      - promote-stem-blend-waveform.txt

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact user-tested Stem Blend menu patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/stem-blend-menu
          git show origin/agent/stem-blend-menu:patch-stem-blend-menu.py > patch-stem-blend-menu.py
          python patch-stem-blend-menu.py
          python - <<'PY'
          from pathlib import Path
          p = Path('foo_spectral_waveform.cpp')
          s = p.read_text(encoding='utf-8')
          s = s.replace('"0.5.0-test1 Stem Blend Menu",', '"0.5.0 Stable Stem Blend Menu",', 1)
          s = s.replace('console::print("foo_spectral_waveform: v0.5.0-test1 loaded");', 'console::print("foo_spectral_waveform: v0.5.0 loaded");', 1)
          p.write_text(s, encoding='utf-8')
          PY
          rm -f patch-stem-blend-menu.py
          rm -f promote-stem-blend-waveform.txt
          rm -f .github/workflows/promote-stem-blend-stable.yml

      - name: Commit stable source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Promote tested Stem Blend waveform controls to stable"
          git push origin HEAD:main
