name: Apply transport cache max macro fix

on:
  push:
    paths:
      - '.github/fix_transport_max_macros.py'
      - '.github/workflows/apply-fix-transport-max.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/fix_transport_max_macros.py
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add waveform_cache.cpp
          git diff --cached --quiet && exit 0
          git commit -m "Fix Windows max macro in transport cache"
          git push
