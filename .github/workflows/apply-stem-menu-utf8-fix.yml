name: Apply stem menu UTF-8 fix

on:
  push:
    paths:
      - '.github/workflows/apply-stem-menu-utf8-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source patch
        run: python .github/fix_stem_menu_utf8.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spectral_ui.cpp
          git commit -m "Fix waveform Stem Separator menu text conversion"
          git push
