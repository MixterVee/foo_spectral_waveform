name: Apply adaptive time ruler

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-time-ruler.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source patch
        run: python .github/time_ruler_patch.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spectral_ui.cpp
          git diff --cached --check
          git commit -m "Add adaptive waveform time ruler"
          git push origin HEAD:main
