name: Apply widened transport PCM sharing

on:
  push:
    paths:
      - '.github/widen_transport_share.py'
      - '.github/workflows/apply-widen-transport-share.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/widen_transport_share.py
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stem_waveform_analysis.cpp
          git diff --cached --quiet && exit 0
          git commit -m "Widen shared stem PCM transport overlap"
          git push
