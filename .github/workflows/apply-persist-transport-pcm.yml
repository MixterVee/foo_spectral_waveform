name: Apply persistent transport PCM

on:
  push:
    paths:
      - '.github/persist_transport_pcm_patch.py'
      - '.github/workflows/apply-persist-transport-pcm.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/persist_transport_pcm_patch.py
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add waveform_cache.h waveform_cache.cpp stem_waveform_analysis.cpp live_output_capture.cpp
          git diff --cached --quiet && exit 0
          git commit -m "Persist separated transport PCM across restarts"
          git push
