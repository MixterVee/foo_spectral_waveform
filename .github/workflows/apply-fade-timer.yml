name: Apply stem preview fade timer

on:
  push:
    paths:
      - '.github/workflows/apply-fade-timer.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source patch
        run: python .github/fade_timer_patch.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spectral_ui.cpp
          git commit -m "Animate progressive stem waveform fades"
          git push
