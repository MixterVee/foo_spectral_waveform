name: Fold tested Spectral patches into source

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  fold:
    if: github.event.head_commit.message == 'Fold tested Spectral patches into source'
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact tested source transforms
        shell: powershell
        run: |
          .\tools\apply_mute_grab_patch.ps1
          .\tools\remove_scratch_debug_overlay.ps1

      - name: Commit transformed source
        shell: powershell
        run: |
          git config user.name "MixterVee"
          git config user.email "mixtervandal@gmail.com"
          git add spectral_ui.cpp
          git commit -m "Make tested Spectral source permanent"
          git push origin HEAD:main
