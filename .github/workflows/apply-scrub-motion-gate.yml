name: Apply scrub motion gate

on:
  push:
    paths:
      - '.github/scrub_motion_gate_patch.py'
      - '.github/workflows/apply-scrub-motion-gate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scrub_motion_gate_patch.py
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spectral_ui.cpp
          git diff --cached --quiet && exit 0
          git commit -m "Keep scrub audible while mouse is moving"
          git push
