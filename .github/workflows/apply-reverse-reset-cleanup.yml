name: Apply reverse reset cleanup

on:
  push:
    paths:
      - '.github/remove_reverse_confirm_resets.py'
      - '.github/workflows/apply-reverse-reset-cleanup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply cleanup
        run: python .github/remove_reverse_confirm_resets.py
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spectral_ui.cpp
          git commit -m "Remove stale reverse clock reset references"
          git push
