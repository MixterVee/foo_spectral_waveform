name: Promote tested waveform status source temp

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/promote-status-source-temp.yml'
      - 'promote-status-source-main-trigger.txt'
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  promote:
    runs-on: windows-2022
    steps:
      - name: Checkout tested branch
        uses: actions/checkout@v4
        with:
          ref: agent/stem-status-overlay
          fetch-depth: 1

      - name: Materialize tested v4 status patches
        shell: pwsh
        run: |
          function Invoke-WorkflowStep([string]$path, [string]$stepName) {
            $workflow = Get-Content $path
            $nameIndex = -1
            for ($i = 0; $i -lt $workflow.Count; ++$i) {
              if ($workflow[$i] -eq ('      - name: ' + $stepName)) { $nameIndex = $i; break }
            }
            if ($nameIndex -lt 0) { throw "Step not found: $stepName" }
            $runIndex = -1
            for ($i = $nameIndex + 1; $i -lt $workflow.Count; ++$i) {
              if ($workflow[$i] -eq '        run: |') { $runIndex = $i; break }
            }
            if ($runIndex -lt 0) { throw "Run block not found: $stepName" }
            $script = New-Object System.Collections.Generic.List[string]
            for ($i = $runIndex + 1; $i -lt $workflow.Count; ++$i) {
              $line = $workflow[$i]
              if ($line -match '^      - name: ') { break }
              if ($line.StartsWith('          ')) { $script.Add($line.Substring(10)) }
              elseif ($line.Trim().Length -eq 0) { $script.Add('') }
              else { throw "Unexpected indentation in $stepName: $line" }
            }
            $temp = Join-Path $env:RUNNER_TEMP (([guid]::NewGuid().ToString()) + '.ps1')
            Set-Content $temp $script -Encoding UTF8
            & $temp
          }

          Invoke-WorkflowStep '.github/workflows/build-status-overlay-v4.yml' 'Apply existing status overlay patches'
          Invoke-WorkflowStep '.github/workflows/build-status-overlay-v4.yml' 'Compose complete frame off-screen'

      - name: Commit tested v4 implementation
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add spectral_ui.cpp live_output_capture.cpp live_output_capture.h stem_processing_status_service.h
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'Make atomic stem status overlay permanent [skip ci]'
            git push origin HEAD:agent/stem-status-overlay
          }
