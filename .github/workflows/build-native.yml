name: Build Native foo_spectral_waveform

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Get foobar2000 SDK
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.foobar2000.org/SDK-2025-03-07.7z" -OutFile sdk.7z
          7z x sdk.7z -osdk

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build PFC
        shell: pwsh
        run: |
          msbuild sdk\pfc\pfc.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v142

      - name: Build foobar2000 SDK
        shell: pwsh
        run: |
          msbuild sdk\foobar2000\SDK\foobar2000_SDK.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v142

      - name: Build component client
        shell: pwsh
        run: |
          msbuild sdk\foobar2000\foobar2000_component_client\foobar2000_component_client.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v142

      - name: Build foo_spectral_waveform
        shell: pwsh
        run: |
          msbuild foo_spectral_waveform.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v142

      - name: Package fb2k-component
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package\foo_spectral_waveform | Out-Null
          Copy-Item x64\Release\foo_spectral_waveform.dll package\foo_spectral_waveform\foo_spectral_waveform.dll
          Compress-Archive -Path package\foo_spectral_waveform -DestinationPath foo_spectral_waveform.zip
          Copy-Item foo_spectral_waveform.zip foo_spectral_waveform.fb2k-component

      - name: Upload component
        uses: actions/upload-artifact@v4
        with:
          name: foo_spectral_waveform-native-x64
          path: |
            foo_spectral_waveform.fb2k-component
            x64\Release\foo_spectral_waveform.dll
