name: Build Spectral Waveform stem status overlay test

on:
  workflow_dispatch:
  push:
    branches: [ agent/stem-status-overlay ]
    paths:
      - '.github/workflows/build-native.yml'
      - 'stem_processing_status_service.h'
      - 'live_output_capture.h'
      - 'status-overlay-trigger.txt'

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Record run id for chat handoff
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force deliverables | Out-Null
          Set-Content deliverables\status-overlay-waveform-run-id.txt "$env:GITHUB_RUN_ID" -Encoding ascii
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deliverables/status-overlay-waveform-run-id.txt
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Record waveform status overlay test run [skip ci]"
            git push origin HEAD:agent/stem-status-overlay
          }

      - name: Patch progressive analysis status and overlay
        shell: pwsh
        run: |
          $nl = [Environment]::NewLine

          $capturePath = "$env:GITHUB_WORKSPACE\live_output_capture.cpp"
          $capture = Get-Content $capturePath -Raw

          if ($capture -notmatch 'stem_analysis_status status\(\)') {
            $pattern = '(?m)^private:\r?\n    bool is_current'
            if ([regex]::Matches($capture, $pattern).Count -ne 1) { throw "Preview manager status insertion point not found." }
            $block = @(
              '    stem_analysis_status status() {',
              '        std::lock_guard<std::mutex> lock(m_mutex);',
              '        stem_analysis_status out;',
              '        out.mode = (m_mode == 1 || m_mode == 2) ? m_mode : 0;',
              '        out.active = m_analysisActive || m_hasRequest;',
              '        out.ready = m_ready;',
              '        out.progress_percent = m_ready ? 100 : std::clamp(m_analysisProgress, 0, 100);',
              '        return out;',
              '    }',
              '',
              'private:',
              '    void set_progress(std::uint64_t generation, int percent) {',
              '        std::lock_guard<std::mutex> lock(m_mutex);',
              '        if (generation == m_generation) m_analysisProgress = std::clamp(percent, 0, 100);',
              '    }',
              '',
              '    bool is_current'
            ) -join $nl
            $capture = [regex]::Replace($capture, $pattern, $block, 1)
          }

          if ($capture -notmatch 'm_analysisProgress') { throw "Status method patch failed." }
          if ($capture -notmatch 'int m_analysisProgress = 0;') {
            $member = '    bool m_ready = false;'
            if (-not $capture.Contains($member)) { throw "Progress member insertion point not found." }
            $capture = $capture.Replace($member, $member + $nl + '    int m_analysisProgress = 0;')
          }

          if ($capture -notmatch 'totalBlocks') {
            $marker = '                            const bool analyzed = analyze_stems_progressive('
            if (-not $capture.Contains($marker)) { throw "Analysis progress insertion point not found." }
            $prep = @(
              '                            const unsigned totalBlocks = std::max(1u, static_cast<unsigned>(',
              '                                std::ceil(std::max(0.001, original.duration_seconds) / 5.0)));',
              '                            unsigned completedBlocks = 0;',
              '                            set_progress(generation, 0);',
              '',
              $marker
            ) -join $nl
            $capture = $capture.Replace($marker, $prep)

            $oldCapture = '[this, generation, aborter]('
            if (-not $capture.Contains($oldCapture)) { throw "Progress callback capture not found." }
            $capture = $capture.Replace($oldCapture, '[this, generation, aborter, &completedBlocks, totalBlocks](')

            $guard = '                                    if (aborter->is_aborting() || !is_current(generation)) return;'
            if (-not $capture.Contains($guard)) { throw "Progress callback guard not found." }
            $capture = $capture.Replace($guard, @(
              $guard,
              '                                    ++completedBlocks;',
              '                                    const int percent = static_cast<int>(std::min(100u,',
              '                                        (completedBlocks * 100u) / totalBlocks));',
              '                                    set_progress(generation, percent);'
            ) -join $nl)
          }

          if ($capture -notmatch 'm_analysisProgress = 100;') {
            $readyBlock = @(
              '                    if (completed) {',
              '                        m_ready = true;',
              '                    }'
            ) -join $nl
            if (-not $capture.Contains($readyBlock)) { throw "Completion progress insertion point not found." }
            $capture = $capture.Replace($readyBlock, @(
              '                    if (completed) {',
              '                        m_ready = true;',
              '                        m_analysisProgress = 100;',
              '                    }'
            ) -join $nl)
          }

          if ($capture -notmatch 'stem_analysis_status analysis_status\(\)') {
            $marker = 'void refresh_mode() {'
            if (-not $capture.Contains($marker)) { throw "Global analysis status insertion point not found." }
            $global = @(
              'stem_analysis_status analysis_status() {',
              '    if (g_manager) return g_manager->status();',
              '    stem_analysis_status out;',
              '    std::lock_guard<std::mutex> lock(g_previewMutex);',
              '    out.mode = (g_selectedMode == 1 || g_selectedMode == 2) ? g_selectedMode : 0;',
              '    return out;',
              '}',
              '',
              $marker
            ) -join $nl
            $capture = $capture.Replace($marker, $global)
          }
          Set-Content $capturePath $capture -Encoding UTF8

          $uiPath = "$env:GITHUB_WORKSPACE\spectral_ui.cpp"
          $ui = Get-Content $uiPath -Raw
          if ($ui -notmatch 'stem_processing_status_service\.h') {
            $ui = $ui.Replace('#include "stem_transport_service.h"', '#include "stem_transport_service.h"' + $nl + '#include "stem_processing_status_service.h"')
          }

          if ($ui -notmatch 'stem_processing_status_service::class_guid') {
            $guidMarker = @(
              'FOOGUIDDECL const GUID stem_transport_service::class_guid =',
              '{ 0x3f42b0c7, 0x8df1, 0x4fb9, { 0xa6, 0x7d, 0x21, 0x55, 0x91, 0xc8, 0x43, 0x6e } };'
            ) -join $nl
            if (-not $ui.Contains($guidMarker)) { throw "Processing status GUID marker not found." }
            $ui = $ui.Replace($guidMarker, @(
              $guidMarker,
              '',
              'FOOGUIDDECL const GUID stem_processing_status_service::class_guid =',
              '{ 0x7a9c0b21, 0x10c5, 0x4d31, { 0xa9, 0x2e, 0x64, 0x1b, 0x2f, 0x8c, 0x51, 0x73 } };'
            ) -join $nl)
          }

          if ($ui -notmatch 'find_processing_status_service') {
            $transportHelper = @(
              'stem_transport_service::ptr find_transport_service() {',
              '    stem_transport_service::ptr service;',
              '    auto e = stem_transport_service::enumerate();',
              '    if (!e.first(service)) service.release();',
              '    return service;',
              '}'
            ) -join $nl
            if (-not $ui.Contains($transportHelper)) { throw "Status service helper marker not found." }
            $ui = $ui.Replace($transportHelper, @(
              $transportHelper,
              '',
              'stem_processing_status_service::ptr find_processing_status_service() {',
              '    stem_processing_status_service::ptr service;',
              '    auto e = stem_processing_status_service::enumerate();',
              '    if (!e.first(service)) service.release();',
              '    return service;',
              '}'
            ) -join $nl)
          }

          if ($ui -notmatch 'invalidate_processing_status\(\);') {
            $timerMarker = '            if (spectral_waveform::live_output_capture::animation_active()) {'
            if (-not $ui.Contains($timerMarker)) { throw "Timer status repaint marker not found." }
            $ui = $ui.Replace($timerMarker, '            invalidate_processing_status();' + $nl + $timerMarker)
          }

          if ($ui -notmatch 'void invalidate_processing_status\(\)') {
            $marker = '    void invalidate_playhead() {'
            if (-not $ui.Contains($marker)) { throw "Status invalidation insertion point not found." }
            $helper = @(
              '    void invalidate_processing_status() {',
              '        if (m_wnd == nullptr) return;',
              '        RECT rc{};',
              '        GetClientRect(m_wnd, &rc);',
              '        RECT statusRc{0, 0, std::min<LONG>(rc.right, 720L), std::min<LONG>(rc.bottom, 44L)};',
              '        InvalidateRect(m_wnd, &statusRc, FALSE);',
              '    }',
              '',
              $marker
            ) -join $nl
            $ui = $ui.Replace($marker, $helper)
          }

          if ($ui -notmatch 'void draw_processing_overlay') {
            $marker = '    static COLORREF blend_color('
            if (-not $ui.Contains($marker)) { throw "Status overlay insertion point not found." }
            $overlay = @(
              '    void draw_processing_overlay(HDC dc, int width, int height) const {',
              '        if (dc == nullptr || width < 120 || height < 24) return;',
              '',
              '        const auto analysis = spectral_waveform::live_output_capture::analysis_status();',
              '        const int mode = analysis.mode;',
              '        std::wstring label = mode == 1 ? L"Vocals" : (mode == 2 ? L"Instrumental" : L"Original");',
              '',
              '        stem_processing_status backend{};',
              '        bool haveBackend = false;',
              '        auto service = find_processing_status_service();',
              '        if (!service.is_empty()) {',
              '            try { haveBackend = service->get_status(backend); } catch (...) { haveBackend = false; }',
              '        }',
              '',
              '        std::wstring backendName;',
              '        if (haveBackend && backend.engine_ready) {',
              '            if (backend.cpu_fallback) {',
              '                backendName = L"CPU fallback";',
              '            } else if (backend.backend_label[0] != 0) {',
              '                backendName = backend.backend_label;',
              '                const size_t split = backendName.find(L" - ");',
              '                if (split != std::wstring::npos) backendName.erase(0, split + 3);',
              '            } else if (backend.backend_type == stem_processing_backend_cpu) {',
              '                backendName = L"CPU";',
              '            }',
              '        }',
              '',
              '        const ULONGLONG now = GetTickCount64();',
              '        if (haveBackend && backend.processing) m_processingDisplayUntil = now + 1500;',
              '        const bool recentProcessing = m_processingDisplayUntil != 0 && now < m_processingDisplayUntil;',
              '',
              '        if (mode == 0) {',
              '            if (!backendName.empty()) label += L"  |  " + backendName;',
              '            if (haveBackend && backend.engine_ready) {',
              '                label += (backend.processing || recentProcessing)',
              '                    ? L"  |  Pre-caching..."',
              '                    : L"  |  Ready";',
              '            }',
              '        } else {',
              '            if (!backendName.empty()) label += L"  |  " + backendName;',
              '            else if (analysis.active) label += L"  |  Backend starting...";',
              '',
              '            if (analysis.active) {',
              '                wchar_t progress[48]{};',
              '                swprintf_s(progress, L"  |  Processing %d%%", std::clamp(analysis.progress_percent, 0, 100));',
              '                label += progress;',
              '            } else if (analysis.ready) {',
              '                label += L"  |  Ready";',
              '            } else {',
              '                label += L"  |  Preparing...";',
              '            }',
              '        }',
              '',
              '        SIZE textSize{};',
              '        if (!GetTextExtentPoint32W(dc, label.c_str(), static_cast<int>(label.size()), &textSize)) return;',
              '        const int padX = 6;',
              '        const int padY = 3;',
              '        const LONG maxRight = std::max<LONG>(40L, static_cast<LONG>(width * 2 / 3));',
              '        RECT box{6L, 6L, std::min<LONG>(maxRight, 6L + textSize.cx + padX * 2),',
              '            std::min<LONG>(static_cast<LONG>(height - 4), 6L + textSize.cy + padY * 2)};',
              '        if (box.right <= box.left || box.bottom <= box.top) return;',
              '',
              '        HBRUSH background = CreateSolidBrush(query_color(ui_color_background, COLOR_WINDOW));',
              '        FillRect(dc, &box, background);',
              '        DeleteObject(background);',
              '        SetBkMode(dc, TRANSPARENT);',
              '        SetTextColor(dc, query_color(ui_color_text, COLOR_WINDOWTEXT));',
              '        RECT textRc = box;',
              '        textRc.left += padX;',
              '        textRc.right -= padX;',
              '        textRc.top += padY;',
              '        textRc.bottom -= padY;',
              '        DrawTextW(dc, label.c_str(), -1, &textRc, DT_LEFT | DT_VCENTER | DT_SINGLELINE | DT_END_ELLIPSIS | DT_NOPREFIX);',
              '    }',
              '',
              $marker
            ) -join $nl
            $ui = $ui.Replace($marker, $overlay)
          }

          if ($ui -notmatch 'mutable ULONGLONG m_processingDisplayUntil') {
            $memberMarker = '    HDC m_waveDC = nullptr;'
            if (-not $ui.Contains($memberMarker)) { throw "Processing latch member insertion point not found." }
            $ui = $ui.Replace($memberMarker, '    mutable ULONGLONG m_processingDisplayUntil = 0;' + $nl + $nl + $memberMarker)
          }

          $paintMarker = '            draw_view_overlay(dc, width, height);'
          if ($ui.Contains($paintMarker) -and $ui -notmatch 'draw_processing_overlay\(dc, width, height\);') {
            $ui = $ui.Replace($paintMarker, $paintMarker + $nl + '            draw_processing_overlay(dc, width, height);')
          }
          Set-Content $uiPath $ui -Encoding UTF8

          Select-String -Path $capturePath -Pattern 'analysis_status|progress_percent|completedBlocks' -Context 1,2
          Select-String -Path $uiPath -Pattern 'draw_processing_overlay|m_processingDisplayUntil' -Context 1,2

      - name: Get foobar2000 SDK
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/reupen/foobar2000-sdk-unmodified.git sdk

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build PFC
        shell: pwsh
        run: |
          msbuild "sdk\pfc\pfc.vcxproj" /m /p:Configuration=Release /p:Platform=x64 /p:OutDir="$env:GITHUB_WORKSPACE\sdk\pfc\x64\Release\"

      - name: Build foobar2000 SDK
        shell: pwsh
        run: |
          msbuild "sdk\foobar2000\SDK\foobar2000_SDK.vcxproj" /m /p:Configuration=Release /p:Platform=x64 /p:OutDir="$env:GITHUB_WORKSPACE\sdk\foobar2000\SDK\x64\Release\"

      - name: Build component client
        shell: pwsh
        run: |
          msbuild "sdk\foobar2000\foobar2000_component_client\foobar2000_component_client.vcxproj" /m /p:Configuration=Release /p:Platform=x64 /p:OutDir="$env:GITHUB_WORKSPACE\sdk\foobar2000\foobar2000_component_client\x64\Release\"

      - name: Build foo_spectral_waveform
        shell: pwsh
        run: |
          msbuild "foo_spectral_waveform.vcxproj" /m /p:Configuration=Release /p:Platform=x64 /p:BuildProjectReferences=false

      - name: Package status overlay test component
        shell: pwsh
        run: |
          if (!(Test-Path "out\x64\foo_spectral_waveform.dll")) { throw "Built DLL not found." }
          New-Item -ItemType Directory -Path "stage\x64" -Force | Out-Null
          Copy-Item "out\x64\foo_spectral_waveform.dll" "stage\x64\foo_spectral_waveform.dll"
          7z a -tzip foo_spectral_waveform-status-overlay.zip ".\stage\x64\foo_spectral_waveform.dll"
          Rename-Item foo_spectral_waveform-status-overlay.zip foo_spectral_waveform-status-overlay.fb2k-component

      - name: Upload status overlay test component
        uses: actions/upload-artifact@v4
        with:
          name: foo_spectral_waveform-status-overlay
          path: foo_spectral_waveform-status-overlay.fb2k-component
          if-no-files-found: error
