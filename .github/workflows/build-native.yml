name: Build Spectral Waveform

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Get foobar2000 SDK
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/reupen/foobar2000-sdk-unmodified.git sdk

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build PFC x64
        shell: pwsh
        run: |
          msbuild "sdk\pfc\pfc.vcxproj" /m /p:Configuration=Release /p:Platform=x64 /p:OutDir="$env:GITHUB_WORKSPACE\sdk\pfc\x64\Release\"

      - name: Build foobar2000 SDK x64
        shell: pwsh
        run: |
          msbuild "sdk\foobar2000\SDK\foobar2000_SDK.vcxproj" /m /p:Configuration=Release /p:Platform=x64 /p:OutDir="$env:GITHUB_WORKSPACE\sdk\foobar2000\SDK\x64\Release\"

      - name: Build component client x64
        shell: pwsh
        run: |
          msbuild "sdk\foobar2000\foobar2000_component_client\foobar2000_component_client.vcxproj" /m /p:Configuration=Release /p:Platform=x64 /p:OutDir="$env:GITHUB_WORKSPACE\sdk\foobar2000\foobar2000_component_client\x64\Release\"

      - name: Build PFC Win32
        shell: pwsh
        run: |
          msbuild "sdk\pfc\pfc.vcxproj" /m /p:Configuration=Release /p:Platform=Win32 /p:OutDir="$env:GITHUB_WORKSPACE\sdk\pfc\Win32\Release\"

      - name: Build foobar2000 SDK Win32
        shell: pwsh
        run: |
          msbuild "sdk\foobar2000\SDK\foobar2000_SDK.vcxproj" /m /p:Configuration=Release /p:Platform=Win32 /p:OutDir="$env:GITHUB_WORKSPACE\sdk\foobar2000\SDK\Win32\Release\"

      - name: Build component client Win32
        shell: pwsh
        run: |
          msbuild "sdk\foobar2000\foobar2000_component_client\foobar2000_component_client.vcxproj" /m /p:Configuration=Release /p:Platform=Win32 /p:OutDir="$env:GITHUB_WORKSPACE\sdk\foobar2000\foobar2000_component_client\Win32\Release\"

      - name: Build Spectral Waveform x64
        shell: pwsh
        run: |
          msbuild "foo_spectral_waveform.vcxproj" /m /p:Configuration=Release /p:Platform=x64 /p:BuildProjectReferences=false

      - name: Build Spectral Waveform Win32
        shell: pwsh
        run: |
          msbuild "foo_spectral_waveform.vcxproj" /m /p:Configuration=Release /p:Platform=Win32 /p:BuildProjectReferences=false

      - name: Package universal fb2k-component
        shell: pwsh
        run: |
          if (!(Test-Path "out\x64\foo_spectral_waveform.dll")) { throw "Built x64 DLL not found." }
          if (!(Test-Path "out\x86\foo_spectral_waveform.dll")) { throw "Built Win32 DLL not found." }
          Remove-Item "stage" -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path "stage\x64" -Force | Out-Null
          Copy-Item "out\x86\foo_spectral_waveform.dll" "stage\foo_spectral_waveform.dll"
          Copy-Item "out\x64\foo_spectral_waveform.dll" "stage\x64\foo_spectral_waveform.dll"
          Remove-Item "foo_spectral_waveform.zip" -Force -ErrorAction SilentlyContinue
          Remove-Item "foo_spectral_waveform.fb2k-component" -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "stage\*" -DestinationPath "foo_spectral_waveform.zip" -Force
          Rename-Item "foo_spectral_waveform.zip" "foo_spectral_waveform.fb2k-component"

      - name: Upload universal component
        uses: actions/upload-artifact@v4
        with:
          name: foo_spectral_waveform-0.6.1-universal
          path: foo_spectral_waveform.fb2k-component

      - name: Prepare stable release asset
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          Copy-Item "foo_spectral_waveform.fb2k-component" "Spectral-Waveform-0.6.1-Universal-x86-x64.fb2k-component" -Force

      - name: Publish GitHub latest release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.6.1" `
            "Spectral-Waveform-0.6.1-Universal-x86-x64.fb2k-component" `
            --repo "$env:GITHUB_REPOSITORY" `
            --target "$env:GITHUB_SHA" `
            --title "Spectral Waveform 0.6.1" `
            --notes "Stable universal Win32/x64 release. Includes 12-band Serato-style spectral coloring, native Enter Play/Pause routing, zoom-scaled regular/fine playhead movement, solid pause/resume cursor behavior, same-track view preservation, and automatic waveform focus on new tracks." `
            --latest
