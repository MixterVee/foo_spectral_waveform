name: Apply reverse response patch

on:
  push:
    paths:
      - '.github/reverse_tight_patch.py'
      - '.github/workflows/apply-reverse-tight.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/reverse_tight_patch.py
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spectral_ui.cpp
          git commit -m "Tighten reverse engagement and smooth reverse clock"
          git push
