name: Promote Waveform Cache Settings Menu Stable

on:
  push:
    branches: [ main ]
    paths: [ promote-cache-settings-menu.txt ]

permissions:
  contents: write

jobs:
  promote:
    runs-on: windows-2022
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch tested waveform menu patch
        shell: pwsh
        run: |
          git fetch origin agent/cache-settings-menu
          git show origin/agent/cache-settings-menu:patch-cache-settings-menu.py | Set-Content patch-cache-settings-menu.py -Encoding UTF8

      - name: Apply tested waveform Cache Settings menu patch
        shell: pwsh
        run: |
          python .\patch-cache-settings-menu.py
          if ($LASTEXITCODE -ne 0) { throw "Waveform cache settings menu patch failed." }

      - name: Commit stable source and remove temporary promotion files
        shell: pwsh
        run: |
          Remove-Item patch-cache-settings-menu.py -Force
          Remove-Item promote-cache-settings-menu.txt -Force -ErrorAction SilentlyContinue
          Remove-Item .github\workflows\promote-cache-settings-menu-stable.yml -Force

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Promote waveform cache settings menu to stable"
          git push origin HEAD:main
